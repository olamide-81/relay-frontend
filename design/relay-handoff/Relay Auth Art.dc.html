<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;height:100%;min-height:100vh;overflow:hidden;background:#141517;font-family:Geist,system-ui,sans-serif;color:#f7f8f8">
  <svg viewBox="0 0 800 900" preserveAspectRatio="xMidYMin slice" style="position:absolute;inset:0;width:100%;height:100%" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1.2" stroke-linejoin="round">
    <path d="M-40 260 L400 40 L840 260"></path>
    <path d="M-40 420 L240 280 M560 280 L840 420"></path>
    <path d="M400 40 V120"></path>
    <path d="M120 330 L400 190 L680 330 L400 470 Z"></path>
    <path d="M120 330 V370 L400 510 L680 370 V330"></path>
    <path d="M400 470 V510"></path>
    <path d="M190 330 L400 225 L610 330 L400 435 Z" stroke="rgba(255,255,255,.05)"></path>
    <path d="M60 520 L180 460 L300 520 L180 580 Z"></path>
    <path d="M60 520 V548 L180 608 L300 548 V520"></path>
    <path d="M500 520 L620 460 L740 520 L620 580 Z"></path>
    <path d="M500 520 V548 L620 608 L740 548 V520"></path>
    <path d="M300 534 L400 584 L500 534" stroke-dasharray="4 6"></path>
    <path d="M400 510 V584" stroke-dasharray="4 6"></path>
    <path d="M-40 700 L400 480 L840 700" stroke="rgba(255,255,255,.04)"></path>
  </svg>
  <span style="position:absolute;left:50%;top:clamp(140px,22vh,230px);transform:translate(-50%,-50%);width:76px;height:76px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),inset 0 1px 0 rgba(255,255,255,.1),0 24px 48px -16px rgba(0,0,0,.8)"><img src="assets/relay-icon.png" alt="Relay" style="width:38px;height:38px;border-radius:9px;display:block"></span>
  <sc-for list="{{ tiles }}" as="t" hint-placeholder-count="6">
    <span style="position:absolute;transform:translate(-50%,-50%);left:{{ t.x }};top:{{ t.y }};filter:drop-shadow(0 14px 22px rgba(0,0,0,.55))"><dc-import name="Relay App Icon" kind="{{ t.kind }}" size="{{ t.s }}" hint-size="48px,48px"></dc-import></span>
  </sc-for>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:0 clamp(24px,5vw,56px) clamp(36px,6vh,64px);display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;background:linear-gradient(180deg,rgba(20,21,23,0),#141517 30%)">
    <span style="font-family:'Geist Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:#b4b8bf;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.06)">INFRASTRUCTURE DIRECTORY</span>
    <div style="font-size:clamp(22px,2.4vw,30px);font-weight:500;letter-spacing:-0.03em;line-height:1.2;max-width:480px;color:#8a8f98;text-wrap:balance">No cold emails. <span style="color:#f7f8f8">Just the right partners</span> for your <span style="color:#f7f8f8">fintech.</span></div>
    <p style="margin:0;max-width:460px;font-size:14px;line-height:1.6;color:#8a8f98">Search, compare and connect with banks, payment and identity Providers across North America, Europe, Asia, LATAM, Africa and beyond — all in one place.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:800}}">
const T = [['collections', '30%', '37%', 46], ['payouts', '70%', '37%', 46], ['bank', '50%', '47%', 52], ['fx', '22.5%', '58%', 40], ['kyc', '77.5%', '58%', 40], ['cards', '50%', '66%', 40]];
class Component extends DCLogic {
  renderVals() { return { tiles: T.map(([kind, x, y, s]) => ({ kind, x, y, s })) }; }
}
</script>
</body>
</html>
