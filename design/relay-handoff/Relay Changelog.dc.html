<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="description" content="Find, compare and partner with financial Providers across North America, Europe, Asia, LATAM, Africa and beyond.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Relay">
<meta property="og:title" content="Relay — Every financial Provider. One directory.">
<meta property="og:description" content="Find, compare and partner with financial Providers across North America, Europe, Asia, LATAM, Africa and beyond.">
<meta property="og:url" content="https://relay.gratebridge.com">
<meta property="og:image" content="https://relay.gratebridge.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://relay.gratebridge.com/og-image.png">
<meta name="theme-color" content="#0f1011">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#0f1011;color:#f7f8f8;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8a8f98;text-decoration:none;transition:color .12s}
a:hover{color:#f7f8f8}
</style>
<link rel="stylesheet" href="relay-responsive.css">
</helmet>
<div style="position:relative;min-height:100vh;overflow-x:clip;font-family:Geist,system-ui,sans-serif;color:#f7f8f8;background:#0f1011">
  <div style="position:absolute;left:0;right:0;top:0;height:900px;pointer-events:none;background:radial-gradient(90% 60% at 50% 0%,#26282c 0%,#18191c 38%,#0f1011 80%)"></div>
  <dc-import name="Relay Site Nav" hint-size="100%,64px" style="position:sticky;top:0;z-index:50"></dc-import>

  <section data-screen-label="Changelog" data-r="m-sec" style="position:relative;max-width:1000px;margin:0 auto;padding:120px 24px 0">
    <div style="font-family:'Geist Mono',monospace;font-size:12px;color:#62666d;margin-bottom:20px">Changelog</div>
    <h1 style="margin:0;font-weight:500;font-size:clamp(40px,6vw,64px);line-height:1.02;letter-spacing:-0.05em">What's new in Relay</h1>
    <div style="margin-top:72px;display:flex;flex-direction:column">
      <sc-for list="{{ entries }}" as="e" hint-placeholder-count="4">
        <article data-r="m-g1" style="display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px 48px;padding:48px 0;border-top:1px solid rgba(255,255,255,.07)">
          <div style="position:sticky;top:96px;align-self:start"><div style="font-size:13.5px;color:#8a8f98">{{ e.date }}</div><div style="font-family:'Geist Mono',monospace;font-size:12px;color:#62666d;margin-top:6px">{{ e.ver }}</div></div>
          <div style="display:flex;flex-direction:column;gap:20px">
            <div style="display:flex;align-items:center;gap:12px"><dc-import name="Relay App Icon" kind="{{ e.kind }}" size="36" hint-size="36px,36px"></dc-import><h2 style="margin:0;font-size:26px;font-weight:500;letter-spacing:-0.03em">{{ e.title }}</h2></div>
            <p style="margin:0;font-size:16px;line-height:1.65;color:#b4b8bf;max-width:620px">{{ e.body }}</p>
            <sc-if value="{{ e.hasShot }}"><dc-import name="Relay Site Shot" src="{{ e.shot }}" frame-w="1200" frame-h="640" hint-size="100%,420px"></dc-import></sc-if>
            <div style="display:flex;flex-direction:column;gap:8px">
              <sc-for list="{{ e.items }}" as="i" hint-placeholder-count="3"><div style="display:flex;gap:10px;font-size:14px;color:#d4d6da"><span style="font-size:11.5px;font-weight:500;padding:1px 7px;border-radius:999px;height:fit-content;flex:none;color:{{ i.fg }};background:{{ i.bg }}">{{ i.tag }}</span>{{ i.t }}</div></sc-for>
            </div>
          </div>
        </article>
      </sc-for>
    </div>
  </section>

  <dc-import name="Relay Site Footer" cta="{{ false }}" hint-size="100%,400px"></dc-import>
  <dc-import name="Relay Site Cookies" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const T = { New: ['#6fe3b4', 'rgba(111,227,180,.1)'], Improved: ['#8fb8ff', 'rgba(143,184,255,.1)'], Fixed: ['#b4b8bf', 'rgba(255,255,255,.06)'] };
const E = [
  ['October 19, 2026', 'v1.4', 'all', 'Coverage, stated the way we can stand behind it', 'Relay now describes its coverage in regions — North America, Europe, Asia, LATAM, Africa and beyond — instead of Provider and country counts we cannot yet back with live catalogue data. Counts stay off the site until the directory itself reports them.', '', [['Improved', 'Region-first coverage copy across the Directory, Pricing and category pages'], ['Improved', 'Sections we cannot yet support with real data are hidden, not filled in'], ['Fixed', 'Button label spacing on category pages']]],
  ['October 17, 2026', 'v1.3', 'all', 'Waitlist invitations, managed from the admin panel', 'Relay is opening to teams in waves. Every waitlist request can now be reviewed in the admin panel and accepted, resent, rejected or reinstated. Accepted teams receive an invitation email with a personal sign-up link.', '', [['New', 'Accept, resend, reject and reinstate waitlist invitations'], ['New', 'Invitation email with a personal sign-up link'], ['Improved', 'Waitlist request details in the admin panel']]],
  ['October 16, 2026', 'v1.2', 'all', 'Relay Research reports and the pre-launch waitlist', 'Relay Research reports are now public pages, and joining Relay runs through a waitlist while we open access in waves. Admins control which pages are visible on the site.', '', [['New', 'Public Relay Research report pages'], ['New', 'Waitlist sign-up, with registration opening in waves'], ['New', 'Page visibility switches in the admin panel'], ['Improved', 'Landing intro, SEO metadata and the mobile layout']]],
  ['October 15, 2026', 'v1.1', 'bank', 'The new Relay: directory, compare, shortlists and requests', 'The redesigned Relay launched with the full workspace: a Provider directory across Collections, Payouts, FX, Cards, KYC and Banks, side-by-side comparisons, team shortlists, introduction requests and Intelligence with Licence watch.', '', [['New', 'Banks category in the directory, with safeguarding and virtual IBAN details'], ['New', 'Save and name comparisons, and pin them to Favorites'], ['New', 'Send one request to up to five Providers at once'], ['New', 'Licence watch and the licence catalogue in Intelligence']]],
  ['September 24, 2026', 'v1.0', 'all', 'Relay goes live', 'Relay launched in production: the website and workspace at relay.gratebridge.com, backed by the live Relay API, with sign-in working across the dashboard and API hosts.', '', [['New', 'Production website, workspace and API'], ['Improved', 'Sign-in sessions shared across the dashboard and API hosts']]]
];
class Component extends DCLogic {
  renderVals() {
    return { entries: E.map(([date, ver, kind, title, body, shot, items]) => ({ date, ver, kind, title, body, shot, hasShot: !!shot, items: items.map(([tag, t]) => ({ tag, t, fg: T[tag][0], bg: T[tag][1] })) })) };
  }
}
</script>
</body>
</html>
