<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="description" content="Find, compare and partner with financial Providers across North America, Europe, Asia, LATAM, Africa and beyond.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Relay">
<meta property="og:title" content="Relay — Every financial Provider. One directory.">
<meta property="og:description" content="Find, compare and partner with financial Providers across North America, Europe, Asia, LATAM, Africa and beyond.">
<meta property="og:url" content="https://relay.gratebridge.com">
<meta property="og:image" content="https://relay.gratebridge.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://relay.gratebridge.com/og-image.png">
<meta name="theme-color" content="#0f1011">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#0f1011;color:#f7f8f8;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8a8f98;text-decoration:none;transition:color .12s}
a:hover{color:#f7f8f8}
input::placeholder{color:#62666d}
</style>
<link rel="stylesheet" href="relay-responsive.css">
</helmet>
<div style="position:relative;min-height:100vh;overflow-x:clip;font-family:Geist,system-ui,sans-serif;color:#f7f8f8;background:#0f1011">
  <div style="position:absolute;left:0;right:0;top:0;height:900px;pointer-events:none;background:radial-gradient(90% 60% at 50% 0%,#26282c 0%,#18191c 38%,#0f1011 80%)"></div>
  <dc-import name="Relay Site Nav" hint-size="100%,64px" style="position:sticky;top:0;z-index:50"></dc-import>

  <section data-screen-label="For Providers hero" data-r="m-sec" style="position:relative;max-width:1200px;margin:0 auto;padding:120px 24px 0">
    <div style="font-family:'Geist Mono',monospace;font-size:12px;color:#62666d;margin-bottom:20px">For Providers</div>
    <h1 style="margin:0;max-width:900px;font-weight:500;font-size:clamp(40px,6vw,72px);line-height:1.02;letter-spacing:-0.05em;text-wrap:balance">Be found by teams <span style="color:#8a8f98">ready to sign.</span></h1>
    <p style="margin:28px 0 0;max-width:560px;font-size:18px;line-height:1.55;color:#8a8f98">Claim your free profile, keep your data accurate and receive qualified requests. Placement is never for sale, so the best partners win.</p>
    <div style="margin-top:36px;display:flex;gap:8px;max-width:560px;flex-wrap:wrap">
      <input value="{{ q }}" onChange="{{ onQ }}" placeholder="Search for your company" style="flex:1 1 260px;height:44px;padding:0 14px;border:none;outline:none;border-radius:10px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);color:#f7f8f8;font:14.5px Geist,system-ui,sans-serif" style-focus="box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)">
      <span onClick="{{ claim }}" style="height:44px;padding:0 20px;display:inline-flex;align-items:center;border-radius:10px;font-size:14.5px;font-weight:500;color:#0f1011;background:#f7f8f8;cursor:pointer;transition:background-color .15s,transform .2s" style-hover="background:#ffffff;transform:translateY(-1px)">{{ claimLabel }}</span>
    </div>
  </section>

  <section data-screen-label="How it works for Providers" data-r="m-sec" style="position:relative;max-width:1200px;margin:0 auto;padding:120px 24px 0">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:1px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.06)">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="3"><div style="padding:28px;background:#121315;min-height:220px;display:flex;flex-direction:column;gap:12px"><span style="font-family:'Geist Mono',monospace;font-size:12px;color:#62666d">{{ s.n }}</span><div style="margin-top:auto;font-size:18px;font-weight:500;letter-spacing:-0.015em">{{ s.t }}</div><div style="font-size:14px;line-height:1.55;color:#8a8f98">{{ s.d }}</div></div></sc-for>
    </div>
  </section>

  <section data-screen-label="Provider stats" data-r="m-sec" style="position:relative;max-width:1200px;margin:0 auto;padding:120px 24px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:40px 72px;align-items:center">
    <h2 style="margin:0;font-weight:500;font-size:clamp(30px,3.8vw,46px);line-height:1.05;letter-spacing:-0.04em">Requests from teams <span style="color:#8a8f98">with real volume.</span></h2>
    <div data-r="m-g1" style="display:grid;grid-template-columns:1fr 1fr;gap:1px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.06)">
      <sc-for list="{{ stats }}" as="s" hint-placeholder-count="4"><div style="padding:26px;background:#121315"><div style="font-size:34px;font-weight:500;letter-spacing:-0.035em">{{ s.v }}</div><div style="font-size:13px;color:#62666d;margin-top:6px">{{ s.k }}</div></div></sc-for>
    </div>
  </section>

  <dc-import name="Relay Site Footer" cta="{{ false }}" hint-size="100%,400px"></dc-import>
  <dc-import name="Relay Site Cookies" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { q: '', sent: false };
  renderVals() {
    const S = this.state;
    return {
      q: S.q, onQ: e => this.setState({ q: e.target.value, sent: false }),
      claimLabel: S.sent ? 'Check your email' : 'Claim profile', claim: () => S.q.trim() && this.setState({ sent: true }),
      steps: [['Claim your profile', 'Verify your domain and confirm the data we already hold.'], ['Keep it current', 'Update pricing, coverage and licences. Changes go live after review.'], ['Receive requests', 'Qualified intros, pricing and RFP invitations arrive in one inbox.']].map(([t, d], i) => ({ n: String(i + 1).padStart(2, '0'), t, d })),
      stats: [['€2.4M', 'Median monthly volume per request'], ['68%', 'Requests from Series A and later'], ['5 days', 'Median time to first call'], ['0', 'Paid placements, ever']].map(([v, k]) => ({ v, k }))
    };
  }
}
</script>
</body>
</html>
