<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:#161719;color:#f7f8f8;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8a8f98;text-decoration:none}
a:hover{color:#f7f8f8}
</style>
</helmet>
<div style="height:100%;min-height:560px;display:flex;font-family:Geist,system-ui,sans-serif;color:#f7f8f8">

  <div style="flex:0 1 380px;min-width:260px;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.06);min-height:0">
    <div style="display:flex;align-items:center;gap:4px;padding:12px 12px 10px">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3">
        <span onClick="{{ t.pick }}" style="display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;transition:background-color .12s,color .12s;background:{{ t.bg }};color:{{ t.fg }}" style-hover="color:#f7f8f8">{{ t.label }}<span style="font-size:11.5px;color:#62666d;font-variant-numeric:tabular-nums">{{ t.count }}</span></span>
      </sc-for>
      <span onClick="{{ markAll }}" title="Mark all as read" style="margin-left:auto;width:28px;height:28px;display:grid;place-items:center;border-radius:7px;color:#8a8f98;cursor:pointer" style-hover="background:rgba(255,255,255,.05);color:#f7f8f8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 7 17l-5-5"></path><path d="m22 10-7.5 7.5L13 16"></path></svg></span>
    </div>
    <div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:0 8px 12px">
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
        <div style="padding:14px 8px 6px;font-size:12px;font-weight:500;color:#62666d">{{ g.label }}</div>
        <div style="display:flex;flex-direction:column;gap:2px">
          <sc-for list="{{ g.items }}" as="m" hint-placeholder-count="3">
            <div onClick="{{ m.open }}" style="display:flex;gap:12px;padding:10px;border-radius:9px;cursor:pointer;transition:background-color .12s;background:{{ m.bg }}" style-hover="background:rgba(255,255,255,.035)">
              <dc-import name="Relay App Icon" kind="{{ m.kind }}" size="32" hint-size="32px,32px"></dc-import>
              <div style="flex:1;min-width:0">
                <div style="display:flex;align-items:center;gap:8px"><span style="flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:{{ m.weight }};color:{{ m.titleFg }}">{{ m.from }}</span><span style="font-size:12px;color:#62666d;font-variant-numeric:tabular-nums;flex:none">{{ m.when }}</span></div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:3px"><span style="flex:1;min-width:0;font-size:12.5px;color:#8a8f98;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ m.subject }}</span><span style="width:7px;height:7px;border-radius:50%;flex:none;background:#6fe3b4;transition:opacity .2s,transform .2s;opacity:{{ m.dotOp }};transform:scale({{ m.dotScale }})"></span></div>
              </div>
            </div>
          </sc-for>
        </div>
      </sc-for>
      <sc-if value="{{ listEmpty }}">
        <div style="padding:56px 24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center">
          <dc-import name="Relay App Icon" kind="all" size="40" hint-size="40px,40px"></dc-import>
          <div style="font-size:13.5px;font-weight:500;margin-top:6px">You're all caught up</div>
          <div style="font-size:12.5px;color:#62666d">Nothing unread right now.</div>
        </div>
      </sc-if>
    </div>
  </div>

  <div style="flex:1 1 360px;min-width:320px;overflow-y:auto">
    <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ true }}">
      <div style="max-width:680px;margin:0 auto;padding:36px clamp(20px,4vw,40px) 56px;display:flex;flex-direction:column;gap:24px">
        <div style="display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">
          <dc-import name="Relay App Icon" kind="{{ sel.kind }}" size="44" hint-size="44px,44px"></dc-import>
          <div style="flex:1 1 160px;min-width:0">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-size:14px;font-weight:500;white-space:nowrap">{{ sel.from }}</span><span style="display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#8a8f98;padding:1px 8px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)"><span style="width:6px;height:6px;border-radius:50%;background:{{ sel.accent }}"></span>{{ sel.cat }}</span></div>
            <div style="font-size:12.5px;color:#62666d;margin-top:3px;white-space:nowrap">{{ sel.full }}</div>
          </div>
          <span onClick="{{ toggleRead }}" title="{{ readLabel }}" style="flex:none;white-space:nowrap;height:28px;padding:0 10px;display:inline-flex;align-items:center;border-radius:7px;font-size:12.5px;font-weight:500;color:#d4d6da;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)" style-hover="background:rgba(255,255,255,.05);color:#f7f8f8">{{ readLabel }}</span>
        </div>
        <h2 style="margin:0;font-weight:500;font-size:22px;letter-spacing:-0.02em;line-height:1.25;text-wrap:balance">{{ sel.subject }}</h2>
        <p style="margin:0;font-size:14.5px;line-height:1.65;color:#b4b8bf;text-wrap:pretty">{{ sel.body }}</p>
        <sc-if value="{{ sel.hasFacts }}">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.06)">
            <sc-for list="{{ sel.facts }}" as="f" hint-placeholder-count="3">
              <div style="padding:14px 16px;background:#18191b"><div style="font-size:12px;color:#62666d">{{ f.k }}</div><div style="font-size:15px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums">{{ f.v }}</div></div>
            </sc-for>
          </div>
        </sc-if>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <span style="height:32px;padding:0 14px;display:inline-flex;align-items:center;border-radius:8px;font-size:13px;font-weight:500;color:#0f1011;background:#f7f8f8;cursor:pointer" style-hover="background:#e3e5e8">{{ sel.primary }}</span>
          <span style="height:32px;padding:0 12px;display:inline-flex;align-items:center;border-radius:8px;font-size:13px;font-weight:500;color:#d4d6da;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)" style-hover="background:rgba(255,255,255,.05);color:#f7f8f8">View provider</span>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ noSel }}">
      <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#62666d;font-size:13px">Select a message</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const MSGS = [
  { id: 1, day: 'Today', kind: 'kyc', cat: 'KYC', accent: '#ffab7a', from: 'Kestrel Identity', when: '9:42', full: 'Today at 9:42', subject: 'Intro accepted — let\u2019s set up a call', body: 'Thanks for reaching out through Relay. We\u2019d be happy to walk you through document verification and sanctions screening for your onboarding flow. Pick a time that suits you and we\u2019ll share sandbox keys ahead of the call.', facts: [['Coverage', '190 countries'], ['From', '$0.45 / check'], ['Median time', '4.2s']], primary: 'Book a call', unread: true },
  { id: 2, day: 'Today', kind: 'payouts', cat: 'Payouts', accent: '#d6ee4e', from: 'Ledgerline', when: '8:15', full: 'Today at 8:15', subject: 'New commercials for EU payouts', body: 'Ledgerline has published updated pricing for SEPA and SEPA Instant payouts. Volume tiers now start lower, and instant settlement is included on every plan.', facts: [['From', '0.3%'], ['Settles', 'Instant'], ['Corridors', '42']], primary: 'Compare pricing', unread: true },
  { id: 3, day: 'Today', kind: 'fx', cat: 'FX', accent: '#8fb8ff', from: 'Meridian FX', when: '7:03', full: 'Today at 7:03', subject: 'EUR → USD settlement now same day', body: 'Meridian FX moved EUR → USD conversions to same-day settlement for all business accounts. Spreads are unchanged.', facts: [['Spread', '0.15%'], ['Settles', 'Same day'], ['Currencies', '38']], primary: 'View rates', unread: true },
  { id: 4, day: 'Earlier', kind: 'collections', cat: 'Collections', accent: '#6fe3b4', from: 'Tidepool Pay', when: 'Mon', full: 'Monday at 16:20', subject: 'SEPA Instant collections are live', body: 'Tidepool Pay now supports SEPA Instant for incoming payments across the eurozone, with real-time reconciliation webhooks.', facts: [['From', '0.2%'], ['Rails', 'SEPA · ACH'], ['Payout', 'T+0']], primary: 'Add to shortlist', unread: false },
  { id: 5, day: 'Earlier', kind: 'all', cat: 'Relay', accent: '#8a8f98', from: 'Relay', when: 'Sun', full: 'Sunday at 10:00', subject: 'Your weekly directory digest', body: '38 providers joined the directory this week, including 12 in Asia-Pacific and 9 new KYC providers. Your weighting re-scored 5 providers in view.', facts: [['New providers', '38'], ['Countries', '64'], ['Re-scored', '5']], primary: 'Open directory', unread: false },
  { id: 6, day: 'Earlier', kind: 'cards', cat: 'Cards', accent: '#b9a3ff', from: 'Northbeam Cards', when: 'Oct 9', full: 'October 9 at 14:12', subject: 'Virtual card issuing in the UK', body: 'Northbeam Cards opened virtual card issuing for UK businesses, with spend controls and real-time authorisation hooks.', facts: [['Networks', 'Visa · MC'], ['Go-live', '2 weeks'], ['Region', 'UK · EU']], primary: 'Request intro', unread: false }
];
class Component extends DCLogic {
  state = { tab: 'all', sel: 1, unread: Object.fromEntries(MSGS.map(m => [m.id, m.unread])) };
  componentDidMount() { this.read(1); }
  read(id) { this.setState(s => ({ sel: id, unread: { ...s.unread, [id]: false } })); }
  renderVals() {
    const S = this.state;
    const unreadCount = MSGS.filter(m => S.unread[m.id]).length;
    const list = MSGS.filter(m => S.tab === 'all' || (S.tab === 'unread' ? S.unread[m.id] : m.kind !== 'all'));
    const groups = ['Today', 'Earlier'].map(day => ({
      label: day,
      items: list.filter(m => m.day === day).map(m => {
        const on = S.sel === m.id, un = S.unread[m.id];
        return { ...m, open: () => this.read(m.id), bg: on ? 'rgba(255,255,255,.05)' : 'transparent', weight: un ? 600 : 500, titleFg: un ? '#f7f8f8' : '#d4d6da', dotOp: un ? 1 : 0, dotScale: un ? 1 : .4 };
      })
    })).filter(g => g.items.length);
    const sel = MSGS.find(m => m.id === S.sel);
    const tab = (key, label, count) => ({ label, count, bg: S.tab === key ? 'rgba(255,255,255,.06)' : 'transparent', fg: S.tab === key ? '#f7f8f8' : '#8a8f98', pick: () => this.setState({ tab: key }) });
    return {
      tabs: [tab('all', 'All', MSGS.length), tab('unread', 'Unread', unreadCount), tab('providers', 'Providers', MSGS.filter(m => m.kind !== 'all').length)],
      groups, listEmpty: groups.length === 0,
      markAll: () => this.setState({ unread: Object.fromEntries(MSGS.map(m => [m.id, false])) }),
      hasSel: !!sel, noSel: !sel,
      sel: sel ? { ...sel, hasFacts: true, facts: sel.facts.map(([k, v]) => ({ k, v })) } : { facts: [] },
      readLabel: sel && S.unread[sel.id] ? 'Mark as read' : 'Mark as unread',
      toggleRead: () => sel && this.setState(s => ({ unread: { ...s.unread, [sel.id]: !s.unread[sel.id] } }))
    };
  }
}
</script>
</body>
</html>
