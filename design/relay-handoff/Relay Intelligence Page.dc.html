<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#0f1011;color:#f7f8f8;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8a8f98;text-decoration:none;transition:color .12s}
a:hover{color:#f7f8f8}
</style>
</helmet>
<div style="position:relative;min-height:100vh;overflow-x:clip;font-family:Geist,system-ui,sans-serif;color:#f7f8f8;background:#0f1011">
  <div style="position:absolute;left:0;right:0;top:0;height:900px;pointer-events:none;background:radial-gradient(90% 60% at 50% 0%,#26282c 0%,#18191c 38%,#0f1011 80%)"></div>
  <dc-import name="Relay Site Nav" active="intelligence" hint-size="100%,64px" style="position:sticky;top:0;z-index:50"></dc-import>

  <section data-screen-label="Intelligence hero" style="position:relative;max-width:1200px;margin:0 auto;padding:120px 24px 0">
    <div style="font-family:'Geist Mono',monospace;font-size:12px;color:#62666d;margin-bottom:20px">Intelligence</div>
    <h1 style="margin:0;max-width:900px;font-weight:500;font-size:clamp(40px,6vw,72px);line-height:1.02;letter-spacing:-0.05em;text-wrap:balance">The market, <span style="color:#8a8f98">as it moves.</span></h1>
    <p style="margin:28px 0 0;max-width:560px;font-size:18px;line-height:1.55;color:#8a8f98">Pricing changes, launches, licences and benchmarks across every Provider in Relay, refreshed daily and filtered to what you watch.</p>
    <div style="margin-top:56px"><dc-import name="Relay Site Shot" src="Relay%20Intelligence.dc.html" frame-w="1200" frame-h="760" hint-size="100%,520px"></dc-import></div>
  </section>

  <section data-screen-label="Pillars" style="position:relative;max-width:1200px;margin:0 auto;padding:120px 24px 0">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:1px;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(255,255,255,.06)">
      <sc-for list="{{ pillars }}" as="p" hint-placeholder-count="4">
        <div style="padding:28px;background:#121315;display:flex;flex-direction:column;gap:14px;min-height:240px;transition:background-color .2s" style-hover="background:#16171a">
          <span style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:#d4d6da"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><sc-for list="{{ p.icon }}" as="d" hint-placeholder-count="2"><path d="{{ d }}"></path></sc-for></svg></span>
          <div style="margin-top:auto;font-size:17px;font-weight:500;letter-spacing:-0.015em">{{ p.title }}</div>
          <div style="font-size:14px;line-height:1.55;color:#8a8f98">{{ p.body }}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <section data-screen-label="Latest reports" style="position:relative;max-width:1200px;margin:0 auto;padding:140px 24px 0">
    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap">
      <h2 style="margin:0;font-weight:500;font-size:clamp(30px,3.8vw,46px);line-height:1.05;letter-spacing:-0.04em">Latest reports</h2>
      <div style="display:flex;gap:2px;padding:2px;border-radius:999px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)">
        <sc-for list="{{ scopes }}" as="s" hint-placeholder-count="4"><span onClick="{{ s.pick }}" style="height:30px;padding:0 12px;display:inline-flex;align-items:center;border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;transition:background-color .15s,color .15s;background:{{ s.bg }};color:{{ s.fg }}">{{ s.label }}</span></sc-for>
      </div>
    </div>
    <div style="margin-top:32px;display:flex;flex-direction:column;border-top:1px solid rgba(255,255,255,.07)">
      <sc-for list="{{ reports }}" as="r" hint-placeholder-count="5">
        <a href="#" style="display:grid;grid-template-columns:52px minmax(0,1fr) 140px 120px 20px;align-items:center;gap:20px;padding:22px 4px;border-bottom:1px solid rgba(255,255,255,.07);color:#f7f8f8;transition:background-color .2s,padding .25s cubic-bezier(.2,.8,.2,1)" style-hover="background:rgba(255,255,255,.02);padding-left:12px;color:#f7f8f8">
          <dc-import name="Relay App Icon" kind="{{ r.kind }}" size="40" hint-size="40px,40px"></dc-import>
          <div style="min-width:0"><div style="font-size:16px;font-weight:500;letter-spacing:-0.01em">{{ r.title }}</div><div style="font-size:13px;color:#8a8f98;margin-top:4px">{{ r.desc }}</div></div>
          <span style="font-size:13px;color:#8a8f98">{{ r.type }}</span>
          <span style="font-size:13px;color:#62666d">{{ r.date }}</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a8f98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"></path></svg>
        </a>
      </sc-for>
    </div>
  </section>

  <dc-import name="Relay Site Footer" hint-size="100%,560px"></dc-import>
  <dc-import name="Relay Site Cookies" hint-size="0px,0px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PILLARS = [
  ['Signals', 'Pricing changes, launches and coverage updates from Providers on your shortlists.', ['M22 12h-4l-3 9L9 3l-3 9H2']],
  ['Reports', 'Market maps and quarterly reports by category and region, written by Relay Research.', ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'M14 2v6h6', 'M8 13h8', 'M8 17h5']],
  ['FX benchmarks', 'Median and best spreads on major corridors, measured on business accounts.', ['M3 3v18h18', 'm19 9-5 5-4-4-3 3']],
  ['Licence watch', 'Grants, renewals and restrictions across 40+ regulators, as they happen.', ['M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z', 'm9 12 2 2 4-4']]
];
const REPORTS = [
  ['bank', 'Sponsor and partner banks for fintechs', '316 banks profiled across 8 regions', 'Market map', 'October 2026', 'Global'],
  ['fx', 'FX spreads on major corridors, Q3', 'Median EUR → USD spread fell to 0.29%', 'Benchmark', 'October 2026', 'Global'],
  ['payouts', 'Payouts in Europe, Q3', 'Instant payouts now default for 7 in 10 Providers', 'Quarterly', 'September 2026', 'Europe'],
  ['kyc', 'Identity verification in Asia-Pacific', '84 KYC Providers active in the region', 'Market map', 'September 2026', 'Asia-Pacific'],
  ['collections', 'Local payment methods in Latin America', 'Pix accounts for 38% of online payments in Brazil', 'Benchmark', 'August 2026', 'Latin America'],
  ['cards', 'Card issuing in North America, Q3', 'Commercial cards outgrew consumer', 'Quarterly', 'August 2026', 'North America']
];
const SCOPES = ['Global', 'Europe', 'Asia-Pacific', 'Americas'];
class Component extends DCLogic {
  state = { scope: 'Global' };
  renderVals() {
    const S = this.state, inS = r => S.scope === 'Global' || r === S.scope || r === 'Global' || (S.scope === 'Americas' && /America/.test(r));
    return {
      pillars: PILLARS.map(([title, body, icon]) => ({ title, body, icon })),
      scopes: SCOPES.map(s => ({ label: s, pick: () => this.setState({ scope: s }), bg: S.scope === s ? 'rgba(255,255,255,.08)' : 'transparent', fg: S.scope === s ? '#f7f8f8' : '#8a8f98' })),
      reports: REPORTS.filter(r => inS(r[5])).map(([kind, title, desc, type, date]) => ({ kind, title, desc, type, date }))
    };
  }
}
</script>
</body>
</html>
