<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="description" content="Find, compare and partner with 1,600 Providers across 140 countries.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Relay">
<meta property="og:title" content="Relay — Every financial Provider. One directory.">
<meta property="og:description" content="Find, compare and partner with 1,600 Providers across 140 countries.">
<meta property="og:url" content="https://relay.gratebridge.com">
<meta property="og:image" content="https://relay.gratebridge.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://relay.gratebridge.com/og-image.png">
<meta name="theme-color" content="#0f1011">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:#0f1011;color:#f7f8f8;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8a8f98;text-decoration:none;transition:color .12s}
a:hover{color:#f7f8f8}
input::placeholder{color:#62666d}
</style>
<link rel="stylesheet" href="relay-responsive.css">
</helmet>
<div style="min-height:100vh;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));font-family:Geist,system-ui,sans-serif;color:#f7f8f8;background:#0f1011">
  <div data-r="t-hide" data-screen-label="Brand panel" style="position:relative;min-height:100vh;border-right:1px solid rgba(255,255,255,.06)">
    <dc-import name="Relay Auth Art" hint-size="100%,100%" style="position:absolute;inset:0"></dc-import>
  </div>
  <div data-screen-label="Sign up" style="position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:clamp(18px,4vw,28px) clamp(18px,4vw,32px);background:radial-gradient(80% 50% at 50% 0%,#1e1f22 0%,#0f1011 70%)">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <a href="Relay%20Landing.dc.html" style="display:flex;align-items:center;gap:9px;color:#f7f8f8"><img src="assets/relay-icon.png" alt="Relay" style="width:22px;height:22px;display:block;border-radius:5px"><span style="font-weight:500;font-size:16px;letter-spacing:-0.02em">Relay</span><span data-r="s-hide" style="font-size:12.5px;color:#62666d">by Gratebridge</span></a>
      <span style="font-size:13.5px;color:#8a8f98">Have an account? <a href="Relay%20Login.dc.html" style="color:#f7f8f8;font-weight:500">Log in</a></span>
    </div>
    <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:40px 0">
      <div style="width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px;transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1);opacity:{{ ld.op }};transform:{{ ld.tf }}">
        <div>
          <h1 style="margin:0;font-size:30px;font-weight:500;letter-spacing:-0.035em">Create your workspace</h1>
          <p style="margin:8px 0 0;font-size:14.5px;color:#8a8f98">Free forever for small teams. No card required.</p>
        </div>
        <span onClick="{{ google }}" style="height:44px;display:flex;align-items:center;justify-content:center;gap:10px;border-radius:10px;font-size:14.5px;font-weight:500;color:#f7f8f8;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);cursor:pointer;transition:background-color .15s,box-shadow .15s,transform .2s" style-hover="background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);transform:translateY(-1px)">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"></path><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"></path><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"></path><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"></path></svg>
          {{ googleLabel }}
        </span>
        <div style="display:flex;align-items:center;gap:12px;font-size:12px;color:#62666d"><span style="flex:1;height:1px;background:rgba(255,255,255,.08)"></span>or<span style="flex:1;height:1px;background:rgba(255,255,255,.08)"></span></div>
        <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
          <label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:12.5px;color:#8a8f98">{{ f.label }}</span><input type="{{ f.type }}" value="{{ f.value }}" onChange="{{ f.onChange }}" placeholder="{{ f.ph }}" style="height:42px;padding:0 12px;border:none;outline:none;border-radius:10px;background:rgba(255,255,255,.03);box-shadow:{{ f.ring }};color:#f7f8f8;font:14.5px Geist,system-ui,sans-serif;transition:box-shadow .15s" style-focus="box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)"></label>
        </sc-for>
        <div style="display:flex;align-items:center;gap:10px;margin-top:-6px">
          <div style="flex:1;display:flex;gap:4px"><sc-for list="{{ meter }}" as="m" hint-placeholder-count="4"><span style="flex:1;height:3px;border-radius:2px;transition:background-color .25s;background:{{ m }}"></span></sc-for></div>
          <span style="font-size:12px;width:56px;text-align:right;color:{{ strengthFg }}">{{ strength }}</span>
        </div>
        <div onClick="{{ toggleAgree }}" style="display:flex;gap:10px;align-items:flex-start;cursor:pointer">
          <span style="width:16px;height:16px;border-radius:4px;flex:none;margin-top:1px;display:grid;place-items:center;transition:background-color .12s,box-shadow .12s;background:{{ box.bg }};box-shadow:{{ box.ring }}"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#0f1011" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{ box.op }}"><path d="M20 6 9 17l-5-5"></path></svg></span>
          <span style="font-size:12.5px;line-height:1.5;color:#8a8f98">I agree to the <a href="Relay%20Legal.dc.html?doc=terms" style="color:#d4d6da">Terms</a> and <a href="Relay%20Legal.dc.html?doc=privacy" style="color:#d4d6da">Privacy policy</a>.</span>
        </div>
        <sc-if value="{{ hasErr }}"><div style="font-size:13px;color:#ff7b7b">{{ err }}</div></sc-if>
        <span onClick="{{ submit }}" style="height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14.5px;font-weight:500;color:#0f1011;cursor:pointer;transition:background-color .15s,transform .2s,box-shadow .2s;background:{{ btnBg }}" style-hover="transform:translateY(-1px);box-shadow:0 10px 30px -8px rgba(255,255,255,.3)">{{ btnLabel }}</span>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:#62666d"><span>© 2026 Gratebridge Labs</span><span>relay.gratebridge.com</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { name: '', email: '', pw: '', agree: false, tried: false, busy: null, ready: false };
  componentDidMount() { this._t = setTimeout(() => this.setState({ ready: true }), 60); }
  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._g); }
  go(kind) { this.setState({ busy: kind }); this._g = setTimeout(() => { location.href = 'Relay%20Dashboard.dc.html'; }, 1000); }
  renderVals() {
    const S = this.state, nOk = S.name.trim().length > 1, eOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email), pw = S.pw;
    const score = !pw ? 0 : [pw.length >= 8, /[A-Z]/.test(pw) && /[a-z]/.test(pw), /\d/.test(pw), /[^A-Za-z0-9]/.test(pw) || pw.length >= 14].filter(Boolean).length;
    const pOk = pw.length >= 8, ok = nOk && eOk && pOk && S.agree;
    const cols = ['#ff7b7b', '#f2c14e', '#8fb8ff', '#6fe3b4'];
    const bad = c => S.tried && !c ? 'inset 0 0 0 1px rgba(255,123,123,.6)' : 'inset 0 0 0 1px rgba(255,255,255,.1)';
    return {
      ld: { op: S.ready ? 1 : 0, tf: S.ready ? 'none' : 'translateY(14px)' },
      fields: [['name', 'Full name', 'text', 'Sarah Mitchell', nOk], ['email', 'Work email', 'text', 'sarah@company.com', eOk], ['pw', 'Password', 'password', 'At least 8 characters', pOk]].map(([k, label, type, ph, v]) => ({ label, type, ph, value: S[k], onChange: e => this.setState({ [k]: e.target.value }), ring: bad(v) })),
      meter: [0, 1, 2, 3].map(i => i < score ? cols[score - 1] : 'rgba(255,255,255,.08)'),
      strength: pw ? ['Weak', 'Fair', 'Good', 'Strong'][Math.max(0, score - 1)] : '', strengthFg: score ? cols[score - 1] : '#62666d',
      box: { bg: S.agree ? '#6fe3b4' : 'transparent', ring: S.agree ? 'none' : S.tried ? 'inset 0 0 0 1.5px rgba(255,123,123,.7)' : 'inset 0 0 0 1.5px rgba(255,255,255,.22)', op: S.agree ? 1 : 0 },
      toggleAgree: e => { if (e.target.tagName === 'A') return; this.setState(s => ({ agree: !s.agree })); },
      hasErr: S.tried && !ok, err: !nOk ? 'Enter your full name.' : !eOk ? 'Enter a valid work email.' : !pOk ? 'Password must be at least 8 characters.' : 'Please accept the Terms to continue.',
      btnLabel: S.busy === 'email' ? 'Creating workspace…' : 'Create account', btnBg: S.busy === 'email' ? '#d4d6da' : '#f7f8f8',
      submit: () => { if (S.busy) return; if (!ok) return this.setState({ tried: true }); this.go('email'); },
      googleLabel: S.busy === 'google' ? 'Connecting to Google…' : 'Sign up with Google', google: () => !S.busy && this.go('google')
    };
  }
}
</script>
</body>
</html>
