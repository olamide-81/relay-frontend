<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ box }}" style="position:relative;width:100%;border-radius:14px;overflow:hidden;background:#151618;box-shadow:0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.06),0 40px 80px -30px rgba(0,0,0,.85);height:{{ h }}">
  <iframe src="{{ src }}" title="Relay product" tabindex="-1" loading="lazy" style="position:absolute;left:0;top:0;border:0;pointer-events:none;transform-origin:0 0;width:{{ iw }};height:{{ ih }};transform:scale({{ sc }})"></iframe>
  <div style="position:absolute;left:0;right:0;bottom:0;height:{{ fade }};pointer-events:none;background:linear-gradient(180deg,rgba(15,16,17,0),#0f1011)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:520},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Relay Dashboard.dc.html?plan=pro&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;frameW&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1200,&quot;tsType&quot;:&quot;number&quot;},&quot;frameH&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:760,&quot;tsType&quot;:&quot;number&quot;},&quot;fade&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { w: 800 };
  box = React.createRef();
  componentDidMount() { const el = this.box.current; if (el) { this._ro = new ResizeObserver(([e]) => this.setState({ w: e.contentRect.width })); this._ro.observe(el); } }
  componentWillUnmount() { this._ro?.disconnect(); }
  renderVals() {
    const W = this.props.frameW ?? 1200, H = this.props.frameH ?? 760, sc = this.state.w / W;
    return { box: this.box, src: this.props.src ?? 'Relay Dashboard.dc.html?plan=pro', iw: W + 'px', ih: H + 'px', sc: sc.toFixed(4), h: Math.round(H * sc) + 'px', fade: this.props.fade === false ? '0' : '30%' };
  }
}
</script>
</body>
</html>
