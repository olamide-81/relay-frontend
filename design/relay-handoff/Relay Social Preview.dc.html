<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0;background:#0b0c0d;color:#f7f8f8;font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}a{color:#8a8f98;text-decoration:none}a:hover{color:#f7f8f8}</style>
</helmet>
<div id="og" data-screen-label="OG 1200x630" style="position:relative;width:1200px;height:630px;overflow:hidden;background:#0f1011;font-family:Geist,system-ui,sans-serif">
  <div style="position:absolute;right:-180px;top:40px;width:900px;height:700px;background:radial-gradient(closest-side,rgba(111,227,180,.10),rgba(111,227,180,0));pointer-events:none"></div>
  <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(80% 90% at 75% 40%,#000,transparent);-webkit-mask-image:radial-gradient(80% 90% at 75% 40%,#000,transparent)"></div>

  <div style="position:absolute;left:600px;top:118px;width:860px;padding:10px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 70%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)">
    <div style="border-radius:14px;overflow:hidden;background:#151618;box-shadow:0 0 0 1px rgba(255,255,255,.1),inset 0 1px 0 rgba(255,255,255,.06),0 50px 100px -20px rgba(0,0,0,.9)">
      <img src="assets/og-directory.png" alt="Relay directory" style="display:block;width:924px;height:540px">
    </div>
  </div>
  <div style="position:absolute;left:560px;right:0;bottom:0;height:120px;background:linear-gradient(180deg,rgba(15,16,17,0),#0f1011 90%)"></div>
  <div style="position:absolute;left:500px;top:0;bottom:0;width:160px;background:linear-gradient(90deg,#0f1011 20%,rgba(15,16,17,0))"></div>

  <div style="position:absolute;left:72px;top:64px;bottom:64px;width:520px;display:flex;flex-direction:column">
    <div style="display:flex;align-items:center;gap:12px">
      <img src="assets/relay-icon.png" alt="Relay" style="width:36px;height:36px;border-radius:8px;display:block">
      <span style="font-size:26px;font-weight:600;letter-spacing:-0.025em">Relay</span>
      <span style="font-size:16px;color:#62666d;margin-left:2px">by Gratebridge</span>
    </div>
    <h1 style="margin:auto 0 0;font-weight:500;font-size:68px;line-height:1;letter-spacing:-0.05em;text-wrap:balance">Every financial Provider. <span style="color:#8a8f98">One directory.</span></h1>
    <p style="margin:24px 0 0;font-size:21px;line-height:1.45;color:#8a8f98;max-width:440px;text-wrap:pretty">Find, compare and partner with 1,600 Providers across 140 countries.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:630}}"></script>
</body>
</html>
