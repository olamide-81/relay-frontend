<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#151618}a{color:#8a8f98}a:hover{color:#f7f8f8}</style>
<link rel="stylesheet" href="relay-responsive.css">
</helmet>
<div style="position:{{ pos }};right:20px;bottom:20px;z-index:90;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none;font-family:Geist,system-ui,sans-serif;color:#f7f8f8;padding:{{ pad }}">
  <sc-for list="{{ items }}" as="t" hint-placeholder-count="0">
    <div style="pointer-events:auto;position:relative;width:380px;max-width:calc(100vw - 40px);display:flex;align-items:flex-start;gap:12px;padding:12px 12px 12px 12px;border-radius:14px;background:linear-gradient(180deg,rgba(38,39,43,.96),rgba(30,31,34,.96));backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);box-shadow:0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.3),0 20px 48px -12px rgba(0,0,0,.6);transition:opacity .22s,transform .34s cubic-bezier(.2,.9,.25,1.15);opacity:{{ t.op }};transform:{{ t.tf }}">
      <span style="position:relative;width:34px;height:34px;flex:none;border-radius:10px;display:grid;place-items:center;color:#0f1011;background:{{ t.tile }};box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(0,0,0,.18),0 4px 14px -4px {{ t.shadow }}">
        <sc-if value="{{ t.isSuccess }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
        <sc-if value="{{ t.isError }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 7v6"></path><path d="M12 17h.01"></path></svg></sc-if>
        <sc-if value="{{ t.isWarning }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"></path><path d="M12 16.5h.01"></path><path d="M10.3 3.9 2.4 17.5A2 2 0 0 0 4.1 20.5h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg></sc-if>
        <sc-if value="{{ t.isInfo }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 11v6"></path><path d="M12 7h.01"></path></svg></sc-if>
      </span>
      <div style="flex:1;min-width:0;padding-top:1px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:13.5px;font-weight:500;line-height:1.35;letter-spacing:-0.005em">{{ t.title }}</span>
        </div>
        <sc-if value="{{ t.hasDesc }}"><div style="font-size:12.5px;line-height:1.5;color:#8a8f98;margin-top:2px;text-wrap:pretty">{{ t.desc }}</div></sc-if>
        <sc-if value="{{ t.hasAction }}">
          <div style="display:flex;align-items:center;gap:14px;margin-top:9px">
            <span onClick="{{ t.act }}" style="font-size:12.5px;font-weight:500;cursor:pointer;color:{{ t.color }};transition:opacity .12s" style-hover="opacity:.8">{{ t.action }}</span>
            <span onClick="{{ t.close }}" style="font-size:12.5px;font-weight:500;color:#62666d;cursor:pointer" style-hover="color:#d4d6da">Dismiss</span>
          </div>
        </sc-if>
      </div>
      <span onClick="{{ t.close }}" title="Dismiss" style="position:relative;width:26px;height:26px;flex:none;display:grid;place-items:center;border-radius:50%;color:#62666d;cursor:pointer;transition:background-color .12s,color .12s" style-hover="background:rgba(255,255,255,.06);color:#f7f8f8">
        <svg width="26" height="26" viewBox="0 0 26 26" style="position:absolute;inset:0;transform:rotate(-90deg)"><circle cx="13" cy="13" r="11" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1.5"></circle><circle cx="13" cy="13" r="11" fill="none" stroke="{{ t.color }}" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="69.1" stroke-dashoffset="{{ t.off }}" style="transition:stroke-dashoffset {{ t.dur }} linear;opacity:{{ t.ringOp }}"></circle></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" style="position:relative"><path d="M18 6 6 18M6 6l12 12"></path></svg>
      </span>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:460},&quot;toasts&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Array&lt;{id,type,title,desc?,action?,onAction?,duration?}&gt;&quot;},&quot;inline&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onDismiss&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id) =&gt; void&quot;}}">
const V = {
  success: ['#6fe3b4', 'linear-gradient(180deg,#9af0cc,#6fe3b4 55%,#4fcf9b)', 'rgba(111,227,180,.55)'],
  error: ['#ff7b7b', 'linear-gradient(180deg,#ffa3a3,#ff7b7b 55%,#ec5d5d)', 'rgba(255,123,123,.55)'],
  warning: ['#f2c14e', 'linear-gradient(180deg,#f8d77f,#f2c14e 55%,#dfa833)', 'rgba(242,193,78,.5)'],
  info: ['#8fb8ff', 'linear-gradient(180deg,#b5d0ff,#8fb8ff 55%,#6f9cf0)', 'rgba(143,184,255,.55)']
};
const PREVIEW = [
  { id: 'p1', type: 'success', title: 'Comparison saved', desc: 'FX for APAC launch is in Compare and pinned to Favorites.', action: 'Open' },
  { id: 'p2', type: 'error', title: 'Request couldn’t be sent', desc: 'Cobalt Markets isn’t accepting new requests right now.', action: 'Retry' },
  { id: 'p3', type: 'warning', title: 'You’re at 4 of 5 seats', desc: 'Upgrade to Pro for unlimited seats.', action: 'Upgrade' },
  { id: 'p4', type: 'info', title: 'Directory updated', desc: '38 new Providers joined this week, including 9 banks.' }
];
const C = 69.1;
class Component extends DCLogic {
  state = { shown: {} };
  componentDidMount() { this.arm(); }
  componentDidUpdate() { this.arm(); }
  arm() {
    const fresh = (this.props.toasts ?? []).filter(t => !(t.id in this.state.shown));
    if (!fresh.length) return;
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState(s => ({ shown: { ...s.shown, ...Object.fromEntries(fresh.map(t => [t.id, true])) } }))));
  }
  renderVals() {
    const standalone = this.props.toasts === undefined;
    const inline = standalone || !!this.props.inline, S = this.state;
    return {
      pos: inline ? 'static' : 'fixed', pad: standalone ? '20px' : '0',
      items: (standalone ? PREVIEW : this.props.toasts).map(t => {
        const [color, tile, shadow] = V[t.type] ?? V.info, on = inline || S.shown[t.id], leaving = t.leaving;
        const ms = t.duration ?? 4200, sticky = t.type === 'error';
        return { ...t, color, tile, shadow,
          isSuccess: t.type === 'success', isError: t.type === 'error', isWarning: t.type === 'warning', isInfo: (t.type ?? 'info') === 'info',
          hasDesc: !!t.desc, hasAction: !!t.action,
          op: on && !leaving ? 1 : 0, tf: on && !leaving ? 'translateY(0) scale(1)' : 'translateY(12px) scale(.96)',
          off: inline ? (C * .38).toFixed(1) : on ? C : 0, dur: inline ? '0s' : ms + 'ms', ringOp: sticky ? 0 : 1,
          close: () => this.props.onDismiss?.(t.id), act: () => { t.onAction?.(); this.props.onDismiss?.(t.id); } };
      })
    };
  }
}
</script>
</body>
</html>
